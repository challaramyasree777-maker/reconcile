services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      DATABASE_URL: sqlite:///./reconcile.db
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      RECONCILE_API_URL: http://api:8000
    depends_on:
      - api
